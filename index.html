<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Danish | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0f19;
            color: white;
            line-height: 1.6;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 8%;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #00e5ff;
        }

        section {
            min-height: 100vh;
            padding: 120px 8% 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero {
            text-align: center;
            align-items: center;
        }

        .hero h1 {
            font-size: clamp(45px, 8vw, 85px);
            margin-bottom: 10px;
        }

        .hero h1 span {
            color: #00e5ff;
        }

        .hero p {
            font-size: 20px;
            color: #b8c0d0;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 13px 28px;
            border: 1px solid #00e5ff;
            border-radius: 30px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            background: #00e5ff;
            color: #0b0f19;
            transform: translateY(-3px);
        }

        .title {
            font-size: 42px;
            margin-bottom: 25px;
        }

        .title span {
            color: #00e5ff;
        }

        .about p {
            max-width: 750px;
            color: #c5cad5;
            font-size: 18px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .skill {
            padding: 15px 25px;
            border: 1px solid #283044;
            border-radius: 12px;
            background: #111827;
            transition: 0.3s;
        }

        .skill:hover {
            transform: translateY(-5px);
